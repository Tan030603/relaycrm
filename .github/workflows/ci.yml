name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relaycrm
          POSTGRES_PASSWORD: relaycrm
          POSTGRES_DB: relaycrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaycrm -d relaycrm"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      MIGRATION_DATABASE_URL: postgresql://relaycrm:relaycrm@localhost:5432/relaycrm
      DATABASE_URL: postgresql://app_user:app_user_ci@localhost:5432/relaycrm
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Create app_user (non-superuser, no BYPASSRLS)
        run: psql "$MIGRATION_DATABASE_URL" -c "CREATE ROLE app_user LOGIN PASSWORD 'app_user_ci' NOSUPERUSER NOBYPASSRLS"

      - name: Typecheck and build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Migrate (default cell + second cell for the sharding test)
        run: |
          pnpm --filter api exec prisma migrate deploy
          psql "$MIGRATION_DATABASE_URL" -c "CREATE DATABASE relaycrm_b"
          MIGRATION_DATABASE_URL=postgresql://relaycrm:relaycrm@localhost:5432/relaycrm_b pnpm --filter api exec prisma migrate deploy

      - name: Tests (unit, isolation suite, API + worker end to end)
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build images (API + worker share one image)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
          docker build -f infra/docker/api.Dockerfile -t ghcr.io/$OWNER/relaycrm-api:${{ github.sha }} .
          docker build -f infra/docker/web.Dockerfile -t ghcr.io/$OWNER/relaycrm-web:${{ github.sha }} .
      - name: Push to GHCR (main only, tagged with the commit SHA)
        if: env.PUSH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/$OWNER/relaycrm-api:${{ github.sha }}
          docker push ghcr.io/$OWNER/relaycrm-web:${{ github.sha }}
