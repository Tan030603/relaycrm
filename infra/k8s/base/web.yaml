apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: web
          image: relaycrm-web
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# The SPA's nginx proxies /api to the api Service, so one host serves both
# (the refresh cookie stays SameSite=Strict).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relaycrm
spec:
  rules:
    - host: app.relaycrm.example
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
