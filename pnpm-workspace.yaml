packages:
  - apps/*
allowBuilds:
  '@prisma/engines': true
  prisma: true
  msgpackr-extract: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.44'
  - '@vue/compiler-dom@3.5.44'
  - '@vue/compiler-sfc@3.5.44'
  - '@vue/compiler-ssr@3.5.44'
  - '@vue/reactivity@3.5.44'
  - '@vue/runtime-core@3.5.44'
  - '@vue/runtime-dom@3.5.44'
  - '@vue/server-renderer@3.5.44'
  - '@vue/shared@3.5.44'
  - vue@3.5.44
  - bullmq@6.3.15
  - mysql2@3.24.6
# Transitive deps of the Prisma CLI with published advisories (pnpm audit).
overrides:
  mysql2: 3.24.6
  deepmerge-ts: 8.0.2
